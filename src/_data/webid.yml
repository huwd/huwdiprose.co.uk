# Public WebID profile - the single source for every representation of
# https://huwdiprose.co.uk/profile (Turtle at /profile.ttl, HTML at
# /profile, both negotiated by functions/profile.js). See docs/webid.md.
#
# `person` is a permanent identifier: tokens and access policies may come
# to embed this exact string. Never change it, its host, path, trailing
# slash or fragment. Keep it absolute - a relative <#me> in profile.ttl
# would resolve to profile.ttl#me, not profile#me.
#
# Only add statements here that are true, public and backed by a real,
# working resource. No placeholder issuers, storage or inboxes.

person: https://huwdiprose.co.uk/profile#me
document: https://huwdiprose.co.uk/profile
name: Huw Diprose
homepage: https://huwdiprose.co.uk/
# Solid-OIDC issuer, published as solid:oidcIssuer. Solid servers accept a
# login for this WebID only from this issuer. It is a self-hosted
# Solid-OIDC broker (github.com/huwd/solid-oidc), which signs people in
# through Pocket ID.
# Like `person`, never change it: it is in every token the issuer signs.
oidc_issuer: https://id.huwdiprose.co.uk
# Solid Pod, published as pim:storage. Solid apps read it to find where to
# read and write this person's data. It is a Community Solid Server whose
# root is the storage; only this WebID has access.
# Never change it: it is in every resource URL in the Pod. Keep the
# trailing slash.
storage: https://pod.huwdiprose.co.uk/

# Avatar, published as foaf:img. The site favicon doubles as it.
image: https://huwdiprose.co.uk/favicon.png

# Online accounts held by the person, published as foaf:account.
accounts:
  - label: Bluesky
    url: https://bsky.app/profile/huwdiprose.bsky.social
  - label: X
    url: https://x.com/huwdiprose
  - label: GitHub
    url: https://github.com/huwd
  - label: Keybase
    url: https://keybase.io/huwdiprose
